# Daily encrypted backup of the PRODUCTION database (decision 97; docs/backup-restore.md).
#
# pg_dump 17 (the Supabase server's major version) of the schemas RentDesk needs to come
# back: public, app, auth (sign-in accounts), storage (file records, not the files) and
# supabase_migrations, plus a manifest of row counts per table. Encrypted with gpg
# (AES-256, passphrase from a secret) before it leaves the job, uploaded as a workflow
# artifact kept 30 days. Free: GitHub Actions minutes and artifact storage.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SUPABASE_DB_URL_PROD  the SESSION POOLER connection string (port 5432; GitHub runners
#                         have no IPv6, so not the direct db.<ref>.supabase.co host)
#   BACKUP_PASSPHRASE     a long random passphrase, also kept in your password manager
#                         (without it no backup can be opened)
name: Database backup

on:
  schedule:
    # 20:30 UTC = 02:00 Asia/Colombo, after the daily job (19:00-20:29 UTC).
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check the secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::The SUPABASE_DB_URL_PROD secret is not set."; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 20 ] || { echo "::error::The BACKUP_PASSPHRASE secret is missing or shorter than 20 characters."; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/backup

      - name: Install the Postgres 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump, check and encrypt
        id: dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL_PROD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          PG=/usr/lib/postgresql/17/bin
          NAME="rentdesk-$(date -u +%Y%m%d-%H%M)"
          mkdir -p work
          "$PG/pg_dump" "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=app --schema=auth --schema=storage --schema=supabase_migrations \
            --file=work/rentdesk.dump
          "$PG/psql" "$DB_URL" -At -F $'\t' -v ON_ERROR_STOP=1 -f scripts/backup/manifest.sql > work/manifest.txt
          # The archive must be readable and hold data for the manifest's tables.
          "$PG/pg_restore" --list work/rentdesk.dump > work/toc.txt
          tables=$(grep -vc '^last_migration' work/manifest.txt)
          data=$(grep -c ' TABLE DATA ' work/toc.txt || true)
          [ "$tables" -gt 40 ] || { echo "::error::The manifest lists only $tables tables."; exit 1; }
          [ "$data" -eq "$tables" ] || echo "::warning::The dump has data for $data tables, the manifest lists $tables."
          echo "Tables: $tables (data in the dump: $data); last migration: $(grep '^last_migration' work/manifest.txt | cut -f2); dump: $(du -h work/rentdesk.dump | cut -f1)"
          tar -C work -cf "$NAME.tar" rentdesk.dump manifest.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$NAME.tar.gpg" "$NAME.tar" 3<<<"$BACKUP_PASSPHRASE"
          # Prove it opens with the passphrase before uploading it.
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --decrypt "$NAME.tar.gpg" 3<<<"$BACKUP_PASSPHRASE" | tar -t > /dev/null
          shred -u "$NAME.tar" work/rentdesk.dump work/manifest.txt work/toc.txt
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: ${{ steps.dump.outputs.name }}.tar.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
